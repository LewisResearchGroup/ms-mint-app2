name: Build Executables (Optimized)

on:
  push:
    tags:
      - "v*" # Only build on version tags
  workflow_dispatch:

# Default is read-only; the release job overrides to contents:write.
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Python\3.7" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Python\3.8" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Python\3.9" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Python\3.10" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Python\3.11" -ErrorAction SilentlyContinue
        shell: powershell
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install pyinstaller
          pip install "matplotlib>=3.10.8"
          pip install -e . --no-cache-dir
          echo "Switching to polars-lts-cpu for broad compatibility..."
          pip uninstall -y polars
          pip install polars-lts-cpu
        shell: bash

      - name: Create Asari environment
        run: |
          cd pyinstaller
          python create_asari_env.py
        shell: bash
        env:
          PYTHONIOENCODING: utf-8

      - name: Generate matplotlib font cache
        run: |
          cd pyinstaller
          python prebuild_matplotlib_cache.py
        shell: bash
        env:
          PYTHONIOENCODING: utf-8

      - name: Build executable with PyInstaller
        run: |
          cd pyinstaller
          pyinstaller --noconfirm --clean --log-level=INFO Mint.spec
        shell: bash
        env:
          PYTHONOPTIMIZE: 1

      - name: Verify build
        run: |
          if (Test-Path "pyinstaller\dist\Mint\Mint.exe") {
            Write-Host "[OK] Executable built successfully!"
          } else {
            Write-Host "[ERROR] Build failed"
            exit 1
          }
        shell: powershell

      - name: Get version
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=${GITHUB_REF#refs/tags/}
          else
            version="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
        shell: bash

      # NOTE: keep your existing upload path; the release job archives accordingly.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mint-Windows-x64-${{ steps.get_version.outputs.version }}
          path: pyinstaller/dist/Mint/
          retention-days: 90
          compression-level: 9

  build-linux:
    name: Build Linux Executable (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install pyinstaller
          pip install "matplotlib>=3.10.8"
          pip install -e . --no-cache-dir
          echo "Switching to polars-lts-cpu for broad compatibility..."
          pip uninstall -y polars
          pip install polars-lts-cpu

      - name: Create Asari environment
        run: |
          cd pyinstaller
          python create_asari_env.py
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8

      - name: Generate matplotlib font cache
        run: |
          cd pyinstaller
          python prebuild_matplotlib_cache.py
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8

      - name: Check disk space before build
        run: df -h

      - name: Build executable with PyInstaller
        run: |
          cd pyinstaller
          pyinstaller --noconfirm --clean --log-level=DEBUG Mint.spec 2>&1 | tee build.log
        env:
          PYTHONOPTIMIZE: 1

      - name: Verify build
        run: |
          if [ -f "pyinstaller/dist/Mint/Mint" ]; then
            echo "[OK] Executable built successfully!"
            chmod +x pyinstaller/dist/Mint/Mint
          else
            echo "[ERROR] Build failed - executable not found"
            ls -la pyinstaller/dist/ || echo "dist directory does not exist"
            exit 1
          fi

      - name: Get version
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=${GITHUB_REF#refs/tags/}
          else
            version="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      # NOTE: keep your existing upload path; the release job archives accordingly.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mint-Linux-x64-${{ steps.get_version.outputs.version }}
          path: pyinstaller/dist/Mint/
          retention-days: 90
          compression-level: 6

  release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    # REQUIRED to create/upload release assets
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: |
          echo "Downloaded artifacts:"
          ls -lhR artifacts/ | head -n 200

      # FIX: archive the CONTENTS of the artifact directories (Mint.exe + _internal/),
      # since there is no Mint/ folder inside them.
      - name: Create release archives
        run: |
          set -euo pipefail
          cd artifacts
          echo "Contents of artifacts directory:"
          ls -la

          WINDOWS_DIR=$(find . -maxdepth 1 -type d -name "Mint-Windows-x64-*" | head -n 1)
          if [ -d "$WINDOWS_DIR" ]; then
            echo "Creating Windows zip from: $WINDOWS_DIR"
            ls -la "$WINDOWS_DIR"
            (cd "$WINDOWS_DIR" && zip -9 -r ../../Mint-Windows-x64.zip .)
          else
            echo "ERROR: Windows artifact directory not found"
            exit 1
          fi

          LINUX_DIR=$(find . -maxdepth 1 -type d -name "Mint-Linux-x64-*" | head -n 1)
          if [ -d "$LINUX_DIR" ]; then
            echo "Creating Linux tar.gz from: $LINUX_DIR"
            ls -la "$LINUX_DIR"
            tar -czf ../Mint-Linux-x64.tar.gz -C "$LINUX_DIR" .
          else
            echo "ERROR: Linux artifact directory not found"
            exit 1
          fi

          cd ..
          echo "Final archives created:"
          ls -lh Mint-Windows-x64.zip Mint-Linux-x64.tar.gz

      - name: Get version info
        id: version_info
        run: |
          version=${GITHUB_REF#refs/tags/}
          if [[ "$version" =~ (alpha|beta|rc|preview) ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "is_prerelease=$is_prerelease" >> $GITHUB_OUTPUT

      - name: Create Pre-release
        if: steps.version_info.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Mint-Windows-x64.zip
            Mint-Linux-x64.tar.gz
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## ⚠️ Pre-release / Beta Version

            ### Downloads
            - **Windows**: `Mint-Windows-x64.zip` — Extract, then run `Mint.exe`
            - **Linux**: `Mint-Linux-x64.tar.gz` — Extract, then run `./Mint`

            **Important:** Keep the `_internal/` folder next to the executable.

      - name: Create Stable Release
        if: steps.version_info.outputs.is_prerelease == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Mint-Windows-x64.zip
            Mint-Linux-x64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎉 Stable Release

            ### Downloads
            - **Windows**: `Mint-Windows-x64.zip` — Extract, then run `Mint.exe`
            - **Linux**: `Mint-Linux-x64.tar.gz` — Extract, then run `./Mint`

            **Important:** Keep the `_internal/` folder next to the executable.
