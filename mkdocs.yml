site_name: ms-mint-app2
site_url: https://lewisresearchgroup.github.io/ms-mint-app2/
site_author: Mario E. Valdes-Tresanco et al. 
nav:
  - Home: 'index.md'
  - Introduction: 'introduction.md'
  - Installation: 'install.md' 
  - Quickstart: 'quickstart.md'
  - GUI: 
      - Introduction: 'gui/index.md'
      - Workspaces: 'gui/workspaces.md'
      - MS-Files: 'gui/ms-files.md'
      - Targets: 'gui/targets.md'
      - Optimization: 'gui/optimization.md'
      - Processing: 'gui/processing.md'
      - Analysis: 'gui/analysis.md'
  - Concepts: 'concepts.md'
  - Developer Notes: 'developer-notes.md'
extra:
  analytics:
    provider: google
    property: G-F718PR80XX
  consent:
    title: Cookie consent
    description: > 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
plugins:
  - glightbox
